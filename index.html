<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Gastos Diário</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --accent-bad: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .container { width: 100%; max-width: 420px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 1rem;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .field:last-of-type input { margin-bottom: 0; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    -moz-appearance: textfield;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #052e16;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .result {
    text-align: center;
  }
  .result .label {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 4px;
  }
  .result .value {
    font-size: 2.2rem;
    font-weight: 700;
  }
  .result .value.negative { color: var(--accent-bad); }
  .result .value.positive { color: var(--accent); }
  .breakdown {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .breakdown span.highlight { color: var(--text); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Controle de Gastos Diário</h1>
  <p class="subtitle">Descubra quanto você pode gastar por dia neste mês.</p>

  <div class="card">
    <div class="field">
      <label for="entrada">Entrada (quanto você recebeu)</label>
      <input type="text" inputmode="decimal" class="money" id="entrada" placeholder="0,00">
    </div>
    <div class="field">
      <label for="fixas">Saídas fixas (aluguel, contas, etc.)</label>
      <input type="text" inputmode="decimal" class="money" id="fixas" placeholder="0,00">
    </div>
    <div class="field">
      <label for="cartao">Saídas do cartão de crédito</label>
      <input type="text" inputmode="decimal" class="money" id="cartao" placeholder="0,00">
    </div>
    <div class="field">
      <label for="dias">Dias do mês</label>
      <input type="number" id="dias" value="30" step="1" min="1" max="31">
    </div>
    <button id="calcular">Calcular</button>
  </div>

  <div class="card result hidden" id="resultado">
    <div class="label">Você pode gastar por dia:</div>
    <div class="value" id="valorDia">R$ 0,00</div>
    <div class="breakdown">
      <span>Dinheiro restante: <span class="highlight" id="restante">R$ 0,00</span></span>
      <span>Dividido por <span class="highlight" id="diasUsados">0</span> dias</span>
    </div>
  </div>
</div>

<script>
  function formatarMoeda(valor) {
    return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function centavosParaTexto(centavos) {
    return (centavos / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function aplicarMascaraMoeda(input) {
    input.addEventListener('input', () => {
      const digitos = input.value.replace(/\D/g, '');
      const centavos = parseInt(digitos, 10) || 0;
      input.value = centavos === 0 ? '' : centavosParaTexto(centavos);
    });
  }

  function valorMonetario(input) {
    const digitos = input.value.replace(/\D/g, '');
    const centavos = parseInt(digitos, 10) || 0;
    return centavos / 100;
  }

  document.querySelectorAll('input.money').forEach(aplicarMascaraMoeda);

  document.getElementById('calcular').addEventListener('click', () => {
    const entrada = valorMonetario(document.getElementById('entrada'));
    const fixas = valorMonetario(document.getElementById('fixas'));
    const cartao = valorMonetario(document.getElementById('cartao'));
    const dias = parseInt(document.getElementById('dias').value) || 30;

    const restante = entrada - fixas - cartao;
    const porDia = restante / dias;

    const resultadoCard = document.getElementById('resultado');
    const valorDiaEl = document.getElementById('valorDia');

    resultadoCard.classList.remove('hidden');
    valorDiaEl.textContent = formatarMoeda(porDia);
    valorDiaEl.classList.toggle('negative', porDia < 0);
    valorDiaEl.classList.toggle('positive', porDia >= 0);

    document.getElementById('restante').textContent = formatarMoeda(restante);
    document.getElementById('diasUsados').textContent = dias;
  });
</script>
</body>
</html>
